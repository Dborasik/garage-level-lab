    <path d="M30 42 H136 M30 84 H136 M30 126 H136" stroke="#8b949e" stroke-width="8" stroke-linecap="round"/>
    <path d="M42 146 C56 142 59 126 71 124 C82 122 83 95 96 94 C108 93 109 72 121 69" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="146" r="7" fill="#58a6ff"/>
    <circle cx="121" cy="69" r="7" fill="#7ee787"/>
  </g>
