name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core estimator self-tests
        run: ./tools/run_core_self_tests.sh
      - name: Unit tests, lint, and APK
        run: gradle --no-daemon test lintDebug assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: garage-level-lab-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
